{% extends 'base.html' %} {% block content %}

<div class="min-h-screen bg-slate-100 py-10">
  <div class="max-w-3xl mx-auto">
    <!-- Header -->

    <div class="bg-white rounded-3xl shadow-xl p-8 mb-8">
      <h1 class="text-3xl font-bold text-slate-800">Add Cash</h1>

      <p class="text-slate-500 mt-2">
        Record your income and keep your financial records organized.
      </p>
    </div>

    <!-- Form -->

    <div class="bg-white rounded-3xl shadow-xl p-8">
      <form method="POST">
        {% csrf_token %}

        <!-- Source -->

        <div class="mb-6">
          <label class="block mb-2 font-semibold text-slate-700">
            Source
          </label>

          <input
            type="text"
            name="source"
            id="source"
            placeholder="Example: Salary, Freelance, Business"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition"
            required
          />
        </div>

        <!-- Amount -->

        <div class="mb-6">
          <label class="block mb-2 font-semibold text-slate-700">
            Amount
          </label>

          <div class="relative">
            <span class="absolute left-4 top-3 text-slate-500 font-semibold">
              $
            </span>

            <input
              type="number"
              name="amount"
              id="amount"
              placeholder="0.00"
              step="0.01"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 pl-10 pr-4 py-3 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition"
              required
            />
          </div>
        </div>

        <!-- Description -->

        <div class="mb-8">
          <label class="block mb-2 font-semibold text-slate-700">
            Description
          </label>

          <textarea
            name="description"
            id="description"
            rows="4"
            placeholder="Add a short note about this income..."
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition"
          ></textarea>
        </div>

        <!-- Button -->

        <button
          type="submit"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg transition"
        >
          Add Cash
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
