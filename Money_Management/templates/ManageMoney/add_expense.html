{% extends 'base.html' %} {% block content %}

<div class="min-h-screen bg-slate-100 py-10">
  <div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-3xl shadow-xl p-8 mb-8">
      <h1 class="text-3xl font-bold text-slate-800">Add Expense</h1>

      <p class="text-slate-500 mt-2">
        Record your spending and manage your expenses efficiently.
      </p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8">
      <form method="POST">
        {% csrf_token %}

        <div class="mb-6">
          <label class="block mb-2 font-semibold text-slate-700">
            Description
          </label>

          <input
            type="text"
            name="description"
            placeholder="Example: Food, Rent, Shopping"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:ring-4 focus:ring-red-100 focus:border-red-500 outline-none"
            required
          />
        </div>

        <div class="mb-8">
          <label class="block mb-2 font-semibold text-slate-700">
            Amount
          </label>

          <div class="relative">
            <span class="absolute left-4 top-3 text-slate-500 font-semibold">
              $
            </span>

            <input
              type="number"
              name="amount"
              step="0.01"
              placeholder="0.00"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 pl-10 pr-4 py-3 focus:ring-4 focus:ring-red-100 focus:border-red-500 outline-none"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl shadow-lg transition"
        >
          Add Expense
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
