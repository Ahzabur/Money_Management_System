{% extends 'base.html' %} {% block content %}

<div class="min-h-[88vh] flex items-center justify-center bg-slate-100 px-6">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-10">
    <div class="text-center mb-10">
      <div
        class="mx-auto w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg"
      >
        <span class="text-white text-2xl font-bold">$</span>
      </div>

      <h1 class="mt-6 text-3xl font-bold text-slate-800">Create Account</h1>

      <p class="mt-2 text-slate-500">
        Start managing your finances in one secure place.
      </p>
    </div>

    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          Username
        </label>

        <input
          type="text"
          name="username"
          id="username"
          placeholder="Enter your username"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          Email Address
        </label>

        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          Password
        </label>

        <input
          type="password"
          name="password"
          id="password"
          placeholder="Create a password"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          Confirm Password
        </label>

        <input
          type="password"
          name="confirm_password"
          id="confirm_password"
          placeholder="Confirm your password"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white shadow-lg transition duration-300 hover:bg-indigo-700 hover:shadow-xl"
      >
        Create Account
      </button>
    </form>

    <div class="mt-8 border-t border-slate-200 pt-6 text-center">
      <p class="text-slate-500">
        Already have an account?

        <a
          href="{% url 'login' %}"
          class="font-semibold text-indigo-600 hover:text-indigo-700"
        >
          Sign In
        </a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
